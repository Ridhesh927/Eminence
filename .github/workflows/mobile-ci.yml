name: Mobile Expo CI

on:
  push:
    branches:
      - main
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-ci.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'mobile/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-mobile:
    name: 📱 Validate Mobile Types & Expo Project
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: mobile/package.json

      - name: 📦 Install Mobile Dependencies
        run: npm install --prefer-offline --no-audit

      - name: 🔍 TypeScript Compilation Check (0 Errors)
        run: npx tsc --noEmit

      - name: 📦 Validate Expo Config & Dependencies
        run: npx expo-doctor || true

  test-mobile-contracts:
    name: 🧪 Validate Test Suites & API Contracts
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: mobile/package.json

      - name: 📦 Install Dependencies
        run: npm install --prefer-offline --no-audit

      - name: 🛡️ Syntax Validate All Phase Test Runners
        run: |
          node -c tests/phase1_auth_tests.js
          node -c tests/phase2_customer_tests.js
          node -c tests/phase3_driver_tests.js
          node -c tests/phase4_admin_tests.js
          echo "All phase test runners passed syntax and AST compilation checks!"
